name: Feedback
description: Share a reaction, question, or idea about the book.
title: "Feedback: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: Thanks for reading. Anything helps, from one line to a page.
  - type: input
    id: chapter
    attributes:
      label: Chapter or section
      description: For example "Part III, 3.13 The Sleep Statement", or "whole book".
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What worked, what confused you, what's missing, what you'd change.
    validations:
      required: true
  - type: dropdown
    id: background
    attributes:
      label: Your background (optional)
      options:
        - Tester / QA / SDET
        - Developer
        - DevOps / platform
        - Engineering leader
        - AI / agent builder
        - Curious reader
        - Other
